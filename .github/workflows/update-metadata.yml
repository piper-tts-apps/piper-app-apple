name: Update App Store Metadata

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.mise.toml'
      - 'fastlane/**'
      - '.github/workflows/update_metadata.yml'
      - 'PiperApp/BuildScripts/Configs/version.xcconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_metadata:
    name: Update App Store Connect Metadata
    runs-on: macos-latest
    env:
      CI: true
      FASTLANE_SKIP_UPDATE_CHECK: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v5.2.0

      - name: Install dependencies
        run: |
          mise run setup

      - name: Update Release Notes
        run: |
          CONFIG_PATH="$RUNNER_TEMP/fastlane.json"
          echo "FASTLANE_CONFIG_PATH=${CONFIG_PATH}" >> $GITHUB_ENV
          echo "${{ secrets.FASTLANE_CONFIG_JSON_BASE64 }}" | base64 --decode > "$CONFIG_PATH"
          echo "Starting update-release-notes..."
          mise run update-release-notes \
            --api-key-path "$CONFIG_PATH" \
            --skip-preview

      - name: Clean up
        if: ${{ always() }}
        run: |
          rm -f "$FASTLANE_CONFIG_PATH"
